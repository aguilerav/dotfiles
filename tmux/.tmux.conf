# ==========================================
# PREFIJO Y GENERAL
# ==========================================
# Change default tmux prefix to Ctrl-a
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

set -s set-clipboard on
set -g mouse on
set -g focus-events on
set-window-option -g mode-keys vi

# Change keybinds for splitting windows
unbind %
bind | split-window -h
unbind '"'
bind - split-window -v

# Cerrar TODA la sesión actual con Prefix + X (pide confirmación y/n)
bind X confirm-before -p "¿Cerrar la sesión #S? (y/n)" kill-session

# ==========================================
# SMART PANE SWITCHING (Vim-Tmux Navigator)
# ==========================================
# Esta es la magia. Detecta si estás en Vim o en otra cosa.
# Si estás en Vim, le pasa la tecla a Vim. Si no, se mueve en Tmux.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

# Si necesitas moverte en Tmux forzadamente (aunque estés en Vim), usa Prefix + hjkl
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Como Ctrl+l ahora se usa para moverse, necesitamos una forma de limpiar la pantalla
bind C-l send-keys 'C-l'

# ==========================================
# REDIMENSIONAR (Resize)
# ==========================================
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r m resize-pane -Z

# ==========================================
# COPY MODE (Estilo Vim)
# ==========================================
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection
unbind -T copy-mode-vi MouseDragEnd1Pane

# ==========================================
# LAZYGIT POPUP
# ==========================================
# Abre lazygit en un popup flotante centrado al presionar Ctrl+a y luego g
bind g display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "lazygit"

# ==========================================
# TEMA VISUAL (Minimalista & Powerline)
# ==========================================
# Truecolor: hex exactos en el status line
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"

# Fondo = bg_dark (#011423), idéntico a WezTerm y al chrome de nvim.
# El bar "desaparece" contra el terminal: solo destacan los bloques.
set -g status-style "bg=#011423,fg=#CBE0F0"
set -g status-position bottom
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 60

# Izquierda: sesión (bloque cyan, eco del username de starship)
set -g status-left "#[bg=#0FC5ED,fg=#011423,bold]   #S #[bg=#011423,fg=#0FC5ED]"

# Ventanas inactivas: texto gutter
set -g window-status-separator ""
set -g window-status-format "#[fg=#627E97,bg=#011423] #I:#W "

# Ventana activa: bloque bg_search con triángulo izquierdo
set -g window-status-current-format "#[fg=#0A64AC,bg=#011423]#[bg=#0A64AC,fg=#CBE0F0,bold] #I:#W "

# Derecha: reloj (bloque color borde)
set -g status-right "#[fg=#547998,bg=#011423]#[bg=#547998,fg=#011423,bold] %H:%M %d-%b "

# Bordes de pane
set -g pane-border-style "fg=#143652"
set -g pane-active-border-style "fg=#547998"

# Mensajes y modo copy
set -g message-style "bg=#275378,fg=#CBE0F0"
set -g message-command-style "bg=#275378,fg=#CBE0F0"
set -g mode-style "bg=#275378,fg=#CBE0F0"

set -g popup-border-lines "rounded"
set -g popup-border-style "fg=#547998"
