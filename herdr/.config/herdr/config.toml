onboarding = false
# herdr configuration migrated from tmux/.tmux.conf.
# Only keybindings were migrated. Anything not listed here keeps herdr defaults.

[keys]

# Prefix: tmux used Ctrl-a
prefix = "ctrl+a"

# Splits: tmux used "|" (side by side) and "-" (stacked).
# Keep herdr's defaults ("v" / "-") instead of "|"
split_vertical = "prefix+v"
split_horizontal = "prefix+minus"

# Zoom toggle: tmux used "m"; keep herdr's default "z" as an alias
zoom = ["prefix+z", "prefix+m"]

# Workspace navigation: mirror of switch_tab (prefix+1..9) for workspaces.
# Cycle with prefix+shift+[ / prefix+shift+] (both unset by default in herdr).
switch_workspace = "prefix+shift+1..9"
previous_workspace = "prefix+shift+["
next_workspace = "prefix+shift+]"

# Lazygit popup: tmux used prefix+g, which stays as herdr's "goto".
# herdr runs popup commands from the focused pane's working directory.
[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
description = "Open lazygit popup"
width = "90%"
height = "90%"

# Smart pane switching — vim-herdr-navigation (vim-tmux-navigator ported).
# Direct chords: herdr intercepts Ctrl+h/j/k/l; the plugin action checks the
# pane's foreground process: forwards the key when it is Vim/Neovim, otherwise
# moves herdr's focus. Tradeoff (same as tmux): in shells Ctrl+l no longer
# clears the screen and Ctrl+k no longer kills to end of line.
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

# Equivalent of tmux's `bind C-l send-keys 'C-l'`: inject a literal C-l into
# the focused pane to clear the screen (Ctrl+l is now navigation).
[[keys.command]]
key = "prefix+shift+c"
type = "shell"
command = "herdr pane send-keys \"$HERDR_ACTIVE_PANE_ID\" ctrl+l"
description = "clear screen (forward literal C-l)"

# Dev layout: recreates the tmux `ws` layout in the focused tab:
# nvim (left) | opencode (right, 20%) | terminal (bottom, 20%).
# Script: ~/.config/herdr/scripts/dev-layout.sh (vendored in the repo).
[[keys.command]]
key = "prefix+d"
type = "shell"
command = "bash ~/.config/herdr/scripts/dev-layout.sh"
description = "dev layout: nvim | opencode + terminal"
